[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "expense-mcp-server"
version = "0.1.0"
description = "Expense management MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool",
    "psycopg",
]
